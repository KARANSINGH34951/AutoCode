name: Deploy enrichly-worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ENRICHLYWORKER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ENRICHLYWORKER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ENRICHLYWORKER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy worker
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: enrichlyautotask2026.azurecr.io
          registryUsername: ${{ secrets.ENRICHLYWORKER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ENRICHLYWORKER_REGISTRY_PASSWORD }}
          containerAppName: enrichly-worker
          resourceGroup: EnrichlyJobAutomation
          imageToBuild: enrichlyautotask2026.azurecr.io/enrichly-worker:${{ github.sha }}
